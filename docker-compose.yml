services:
  db:
    image: mongo
    restart: always
    env_file: "env"
    networks:
      - backend
    volumes:
      - persis_data:/data/db
  mongo_express:
    image: mongo-express
    env_file: "env"
    networks:
      - backend
      - frontend
    ports:
      - 8081:8081
    depends_on:
      - db
  mern:
    build: ./mern/
    env_file: "env"
    networks:
      - backend
      - frontend
    ports:
      - 3000:3000
  nginx:
    image: nginx
    networks:
      - frontend
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mern
    restart: always


networks:
  frontend:
  backend:

volumes:
  persis_data:
