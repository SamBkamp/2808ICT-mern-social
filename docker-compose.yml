services:
  db:
    image: mongo
    restart: always
    env_file: "env"
    networks:
      - backend
    volumes:
      - persis_data:/data/db
  mongo_express:
    image: mongo-express
    env_file: "env"
    networks:
      - backend
      - frontend
    ports:
      - 8081:8081
    depends_on:
      - db
  mern:
    build: ./mern/
    env_file: "env"
    networks:
      - backend
      - frontend
    ports:
      - 3000:3000 
  nginx:
    image: nginx
    env_file: "env"
    networks:
      - frontend
    ports:
      - 80:80   
      - 443:443 
    environment:
      - SERVER_NAME
      - SSL_CERT_PATH
      - SSL_KEY_PATH
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro 
      - ./certs:/etc/nginx/certs:ro 
    depends_on:
      - mern
    restart: always
    command: /bin/sh -c "SERVER_NAME=\"${SERVER_NAME:-_}\"; SSL_CERT_PATH=\"${SSL_CERT_PATH:-/etc/nginx/certs/fullchain.pem}\"; SSL_KEY_PATH=\"${SSL_KEY_PATH:-/etc/nginx/certs/privkey.pem}\"; export SERVER_NAME SSL_CERT_PATH SSL_KEY_PATH; envsubst '$$SERVER_NAME $$SSL_CERT_PATH $$SSL_KEY_PATH' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"


networks:
  frontend:
  backend:

volumes:
  persis_data:
