services:
  db:
    image: mongo
    restart: always
    env_file: "env"
    networks:
      - backend
    volumes:
      - persis_data:/data/db
  mongo_express:
    image: mongo-express
    env_file: "env"
    networks:
      - backend
      - frontend
    ports:
      - 8081:8081
    depends_on:
      - db
  mern:
    build: ./mern/
    env_file: "env"
    networks:
      - backend
      - frontend
    ports:
      - 3000:3000 
  nginx:
    image: nginx
    env_file: "env"
    networks:
      - frontend
    ports:
      - 80:80   
      - 443:443 
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro 
      - ./certs:/etc/nginx/certs:ro 
    depends_on:
      - mern
    restart: always

networks:
  frontend:
  backend:

volumes:
  persis_data:
