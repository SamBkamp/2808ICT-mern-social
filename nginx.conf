worker_processes 2;
events {
       worker_connections 2000;
}

http{

	upstream mern {
		 server mern:3000;
	}
	upstream mongo_express {
		 server mongo_express:8081;
	}

	server {
	       listen 80;
	       location / {
	       		proxy_pass http://mern;
		}
	}
	server {
	       listen 8081;
	       location / {
	       		proxy_pass http://mongo_express;
	       }
	}
}